version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reputex_postgres
    environment:
      POSTGRES_USER: reputex
      POSTGRES_PASSWORD: reputex_secret
      POSTGRES_DB: reputex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputex -d reputex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reputex_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://reputex:reputex_secret@postgres:5432/reputex_db
      - DATABASE_URL_SYNC=postgresql://reputex:reputex_secret@postgres:5432/reputex_db
      - JWT_SECRET=reputex-super-secret-key-change-in-production-2026-xyz
      - PLATFORM_MODE=mock
      - AI_PROVIDER=mock
    volumes:
      - .:/app

volumes:
  postgres_data:

