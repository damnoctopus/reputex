version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reputex_postgres
    environment:
      POSTGRES_USER: reputex
      POSTGRES_PASSWORD: reputex_secret
      POSTGRES_DB: reputex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputex -d reputex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reputex_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reputex_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://reputex:reputex_secret@postgres:5432/reputex_db
      - DATABASE_URL_SYNC=postgresql://reputex:reputex_secret@postgres:5432/reputex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=reputex-super-secret-key-change-in-production-2026-xyz
      - PLATFORM_MODE=mock
      - AI_PROVIDER=mock
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reputex_worker
    restart: always
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://reputex:reputex_secret@postgres:5432/reputex_db
      - DATABASE_URL_SYNC=postgresql://reputex:reputex_secret@postgres:5432/reputex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=reputex-super-secret-key-change-in-production-2026-xyz
      - PLATFORM_MODE=mock
      - AI_PROVIDER=mock
    volumes:
      - .:/app

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reputex_beat
    restart: always
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://reputex:reputex_secret@postgres:5432/reputex_db
      - DATABASE_URL_SYNC=postgresql://reputex:reputex_secret@postgres:5432/reputex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=reputex-super-secret-key-change-in-production-2026-xyz
      - PLATFORM_MODE=mock
      - AI_PROVIDER=mock
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
