name: reputex_mobile
description: "RepuTex — AI-powered reputation intelligence for SMBs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.1

  # Storage
  flutter_secure_storage: ^9.2.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^6.1.4

  # Code generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (build-time)
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
