[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Do not perform function call in argument defaults (standard FastAPI Depends)
    "B024",  # Abstract base class without abstract methods
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err`
    "UP007", # Use X | Y for type annotations
    "UP045", # Use X | None for type annotations
    "UP046", # Generic type parameters
    "E501",  # Line too long
    "E712",  # Avoid equality comparisons to True/False (SQLAlchemy column expressions require == True/False or is_)
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E402", "F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
